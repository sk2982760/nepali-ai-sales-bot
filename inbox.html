<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Live Inbox | AI Sales Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden flex flex-col">

  <!-- Top Navbar -->
  <nav class="border-b border-slate-800 bg-slate-950 px-6 py-3 flex justify-between items-center shrink-0">
    <div class="flex items-center space-x-3">
      <div class="h-8 w-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold">AI</div>
      <h1 class="text-lg font-bold tracking-tight">Unified Live Inbox</h1>
    </div>
    <div class="flex items-center space-x-4">
      <a id="dashboard-nav-link" href="/dashboard" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg font-medium transition">Dashboard</a>
    </div>
  </nav>

  <!-- Main Chat Application Shell -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Left Sidebar: Conversations List -->
    <div class="w-80 border-r border-slate-800 bg-slate-950/50 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Conversations</h2>
        <button onclick="loadConversations()" class="text-xs text-indigo-400 hover:underline">Refresh</button>
      </div>
      <div id="conversations-list" class="flex-1 overflow-y-auto divide-y divide-slate-800/50">
        <div class="p-4 text-center text-xs text-slate-500">Loading chats...</div>
      </div>
    </div>

    <!-- Right Window: Active Chat Thread -->
    <div class="flex-1 flex flex-col bg-slate-900">
      
      <!-- Thread Header -->
      <div id="chat-header" class="p-4 border-b border-slate-800 bg-slate-950/30 flex justify-between items-center shrink-0">
        <div>
          <h3 id="chat-user-id" class="font-bold text-slate-200">Select a conversation</h3>
          <p id="chat-channel-type" class="text-xs text-slate-500">Click any user on the left to view messages</p>
        </div>
      </div>

      <!-- Messages Stream -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
        <div class="h-full flex items-center justify-center text-slate-600 text-sm">
          No conversation selected.
        </div>
      </div>

      <!-- Manual Input Bar -->
      <div class="p-4 border-t border-slate-800 bg-slate-950 flex items-center gap-3 shrink-0">
        <input 
          type="text" 
          id="manual-message-input" 
          placeholder="Type a manual reply to take over..." 
          class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 disabled:opacity-50"
          disabled
          onkeypress="if(event.key === 'Enter') sendManualReply()"
        />
        <button 
          id="send-reply-btn"
          onclick="sendManualReply()" 
          disabled
          class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-semibold text-sm px-5 py-2.5 rounded-lg transition"
        >
          Send
        </button>
      </div>

    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const storeId = urlParams.get('store_id') || localStorage.getItem('store_id');
    let activeSenderPsid = null;

    if (storeId) {
      localStorage.setItem('store_id', storeId);
      const dashLink = document.getElementById('dashboard-nav-link');
      if (dashLink) {
        dashLink.href = `/dashboard?store_id=${encodeURIComponent(storeId)}`;
      }
    }

    async function loadConversations() {
      try {
        if (!storeId) {
          document.getElementById('conversations-list').innerHTML = 
            '<div class="p-4 text-center text-xs text-amber-500">No active store session found. Please pass ?store_id= in the URL.</div>';
          return;
        }

        const res = await fetch(`/api/inbox/conversations?store_id=${encodeURIComponent(storeId)}`);
        const conversations = await res.json();

        const listEl = document.getElementById('conversations-list');
        if (!conversations || conversations.length === 0) {
          listEl.innerHTML = '<div class="p-4 text-center text-xs text-slate-500">No active messages found.</div>';
          return;
        }

        listEl.innerHTML = conversations.map(c => `
          <div onclick="selectConversation('${c.sender_psid}')" class="p-4 hover:bg-slate-800/50 cursor-pointer transition ${activeSenderPsid === c.sender_psid ? 'bg-slate-800' : ''}">
            <div class="flex justify-between items-start mb-1">
              <span class="font-mono text-xs font-semibold text-slate-200 truncate w-32">User ${c.sender_psid.substring(0, 8)}...</span>
              <span class="text-[10px] text-slate-500">${new Date(c.last_activity_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
            <p class="text-xs text-slate-400 truncate">${c.last_message}</p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load conversations:', err);
      }
    }

    async function selectConversation(senderPsid) {
      activeSenderPsid = senderPsid;
      document.getElementById('chat-user-id').innerText = `Customer ID: ${senderPsid}`;
      document.getElementById('chat-channel-type').innerText = `Omnichannel Customer Thread`;

      // Enable input field and button when a thread is selected
      document.getElementById('manual-message-input').disabled = false;
      document.getElementById('send-reply-btn').disabled = false;

      loadConversations();
      loadMessages(senderPsid);
    }

    async function loadMessages(senderPsid) {
      try {
        if (!storeId || !senderPsid) return;

        const res = await fetch(`/api/inbox/messages?sender_psid=${encodeURIComponent(senderPsid)}&store_id=${encodeURIComponent(storeId)}`);
        const messages = await res.json();

        const container = document.getElementById('messages-container');
        if (!messages || messages.length === 0) {
          container.innerHTML = '<div class="h-full flex items-center justify-center text-slate-600 text-sm">No message history found.</div>';
          return;
        }

        container.innerHTML = messages.map(msg => {
          const isUser = msg.role === 'user';
          const isAgent = msg.role === 'agent';
          
          let senderLabel = 'AI Assistant';
          if (isUser) senderLabel = 'Customer';
          if (isAgent) senderLabel = 'Human Agent';

          return `
            <div class="flex flex-col ${isUser ? 'items-start' : 'items-end'}">
              <div class="max-w-md px-4 py-2.5 rounded-2xl text-sm ${
                isUser 
                  ? 'bg-slate-800 text-slate-200 rounded-tl-none border border-slate-700/50' 
                  : isAgent 
                    ? 'bg-emerald-600 text-white rounded-tr-none' 
                    : 'bg-indigo-600 text-white rounded-tr-none'
              }">
                ${msg.content}
              </div>
              <span class="text-[10px] text-slate-500 mt-1 px-1">${senderLabel}</span>
            </div>
          `;
        }).join('');

        container.scrollTop = container.scrollHeight;
      } catch (err) {
        console.error('Failed to load thread:', err);
      }
    }

    async function sendManualReply() {
      const input = document.getElementById('manual-message-input');
      const message = input.value.trim();
      
      if (!message || !activeSenderPsid || !storeId) return;

      input.disabled = true;

      try {
        const res = await fetch('/api/inbox/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            store_id: storeId,
            customer_id: activeSenderPsid,
            message_text: message
          })
        });

        const result = await res.json();
        if (result.success) {
          input.value = '';
          await loadMessages(activeSenderPsid);
          loadConversations();
        } else {
          alert('Failed to send message: ' + (result.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Network error sending message.');
      } finally {
        input.disabled = false;
        input.focus();
      }
    }

    loadConversations();
    setInterval(() => {
      loadConversations();
      if (activeSenderPsid) loadMessages(activeSenderPsid);
    }, 5000);
  </script>
</body>
</html>
