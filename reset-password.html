<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - AI Sales Admin</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .auth-card { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 40px; width: 100%; max-width: 440px; }
    .auth-card h2 { margin-top: 0; font-size: 24px; color: #fff; text-align: center; }
    .auth-card p { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
    .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background-color: #1f2937; color: #fff; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #10b981; }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background-color: #10b981; color: #000; font-size: 14px; }
    .btn:hover { background-color: #059669; color: #fff; }
    #msg { margin-top: 15px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Set New Password</h2>
    <p>Type your new password below</p>

    <form id="resetPasswordForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" />
      </div>
      <button type="submit" id="submitBtn" class="btn">Update Password</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    // Extract access_token whether it's in the hash or search params
    function getAccessToken() {
      const fullUrl = window.location.href;
      if (fullUrl.includes('access_token=')) {
        const tokenPart = fullUrl.split('access_token=')[1];
        return tokenPart.split('&')[0];
      }
      return null;
    }

    document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
      e.preventDefault(); // Stop page reload
      
      const newPassword = document.getElementById('newPassword').value;
      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      const accessToken = getAccessToken();

      if (!accessToken) {
        msg.style.color = "#ef4444";
        msg.innerText = "Error: Invalid or missing token link. Please request a new link.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Updating...";
      msg.style.color = "#cbd5e1";
      msg.innerText = "Processing...";

      try {
        const response = await fetch('/api/update-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken, newPassword })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Failed to update password');
        }

        msg.style.color = "#10b981";
        msg.innerText = "Password updated! Redirecting to login...";
        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);

      } catch (err) {
        msg.style.color = "#ef4444";
        msg.innerText = "Error: " + err.message;
        submitBtn.disabled = false;
        submitBtn.innerText = "Update Password";
      }
    });
  </script>
</body>
</html>
