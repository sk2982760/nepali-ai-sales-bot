<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - AI Sales Admin</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .auth-card { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 40px; width: 100%; max-width: 440px; }
    .auth-card h2 { margin-top: 0; font-size: 24px; color: #fff; text-align: center; }
    .auth-card p { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
    .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background-color: #1f2937; color: #fff; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #10b981; }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background-color: #10b981; color: #000; font-size: 14px; }
    .btn:hover { background-color: #059669; color: #fff; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Set New Password</h2>
    <p>Type your new password below</p>

    <form id="resetPasswordForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" />
      </div>
      <button type="submit" class="btn">Update Password</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Extract access_token from URL hash sent by Supabase email link
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;

      if (!accessToken) {
        alert("Invalid or expired password reset link. Please request a new one.");
        return;
      }

      try {
        const res = await fetch('/api/update-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken, newPassword })
        });
        const data = await res.json();

        if (data.success) {
          alert("Password updated successfully! You can now log in.");
          window.location.href = '/login';
        } else {
          alert("Failed to update password: " + data.error);
        }
      } catch (err) {
        alert("Server error while resetting password.");
      }
    });
  </script>
</body>
</html>
