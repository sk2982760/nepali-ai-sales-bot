<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - AI Sales Admin</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .auth-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .auth-card h2 { margin-top: 0; font-size: 24px; color: #fff; text-align: center; }
    .auth-card p { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background-color: #1f2937;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus { border-color: #10b981; }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-meta { background-color: #1877f2; color: #fff; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-meta:hover { background-color: #166fe5; }
    .btn-primary { background-color: #10b981; color: #000; }
    .btn-primary:hover { background-color: #059669; color: #fff; }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #6b7280;
      margin: 20px 0;
      font-size: 12px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #374151; }
    .divider span { padding: 0 10px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #9ca3af; }
    .auth-footer a { color: #10b981; text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Create Store Account</h2>
    <p>Connect your business channels & automate sales</p>

    <!-- One-Click Meta Registration -->
    <button class="btn btn-meta" id="metaSignUpBtn">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      Sign Up with Meta
    </button>

    <div class="divider"><span>OR REGISTER WITH EMAIL</span></div>

    <!-- Email Sign-Up Form -->
    <form id="signupForm">
      <div class="form-group">
        <label for="storeName">Store Name</label>
        <input type="text" id="storeName" placeholder="e.g. Luffy Sales Business" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@store.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign In</a>
    </div>
  </div>

  <script>
    // Standard Form Sign-up
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const storeName = document.getElementById('storeName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ storeName, email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          alert('Sign Up Failed: ' + data.error);
        }
      } catch (err) {
        alert('Server error during sign up.');
      }
    });

    // Meta One-Click Button Handler
    document.getElementById('metaSignUpBtn').addEventListener('click', () => {
      const storeName = prompt('Enter your Store Name to link with Meta:');
      if (!storeName) return;

      const userToken = prompt('Paste your Meta User Access Token (from Graph API Explorer):');
      if (!userToken) return;

      fetch('/api/connect-all-channels', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ store_name: storeName, user_access_token: userToken })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert(`Successfully connected ${data.connectedChannels.join(', ')}! Redirecting...`);
          window.location.href = '/dashboard';
        } else {
          alert('Meta Sign Up Failed: ' + data.error);
        }
      });
    });
  </script>
</body>
</html>
